name: voyago
description: Voyago - AI-powered travel itinerary app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  http: ^1.2.0
  weather_animation: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
